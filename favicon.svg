  <rect class="perf" x="14" y="129" width="28" height="42" rx="5"/>
  <rect class="perf" x="14" y="210" width="28" height="42" rx="5"/>

  <!-- Perforations droite (3) -->
  <rect class="perf" x="358" y="48"  width="28" height="42" rx="5"/>
  <rect class="perf" x="358" y="129" width="28" height="42" rx="5"/>
  <rect class="perf" x="358" y="210" width="28" height="42" rx="5"/>
