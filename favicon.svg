<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <style>
    .frame-bg { fill: #ffffff; stroke: #111111; stroke-width: 12; }
    .perf { fill: #111111; }
    .inner { fill: none; stroke: #111111; stroke-width: 8; }
  </style>

  <!-- Cadre principal -->
